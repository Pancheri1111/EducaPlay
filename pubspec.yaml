name: educaplay
description: "EducaPlay - Aplicativo educativo infantil"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5
  audioplayers: ^5.2.1
  file_picker: ^8.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/imagem_logo.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#ffffff"
  image: "assets/images/imagem_logo.png"
  android_12:
    image: "assets/images/imagem_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/memory/
    - assets/images/word_match/
    - assets/audio/
